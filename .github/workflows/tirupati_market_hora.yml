name: Tirupati Market Hora

on:

  workflow_dispatch:

  schedule:
    # 06:15 IST = 00:45 UTC
    # Monday-Friday
    - cron: "45 0 * * 1-5"


permissions:
  contents: write


jobs:

  calculate-hora:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install packages
        run: |
          pip install requests beautifulsoup4 pandas


      - name: Calculate Tirupati Market Hora
        run: |
          python scripts/tirupati_market_hora.py


      - name: Commit Hora data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || \
            git commit -m \
            "Update Tirupati market Hora"

          git push
